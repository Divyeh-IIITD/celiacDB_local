# ====================================================================
# First-pass HADDOCK3 run for the provided HLA-DQ2.2 receptor and peptide ensemble
# Files provided by the guide:
#   receptor: dq2_2_ed_nm.pdb
#   peptide:  peptide_ens.pdb
# ====================================================================

run_dir = "run_dq2_peptide_ens"
mode = "local"
ncores = 16

molecules = [
    "dq2_2_ed_nm.pdb",
    "peptide_ens.pdb"
]

# ====================================================================
[topoaa]
autohis = false

[rigidbody]
tolerance = 20
# Exploratory-only: reduce rigidbody sampling for fast pipeline validation.
# Restore to the full value used in the final restrained docking run.
sampling = 20
cmrest = true

[flexref]
tolerance = 20
cmrest = true
# peptide is treated as fully flexible in this exploratory, no-restraint run
fle_sta_1 = 1
fle_end_1 = 15
fle_seg_1 = "B"
ssdihed = "alphabeta"
mdsteps_rigid = 5000
mdsteps_cool1 = 5000
mdsteps_cool2 = 10000
mdsteps_cool3 = 10000

[emref]
tolerance = 20
fle_sta_1 = 1
fle_end_1 = 15
fle_seg_1 = "B"
ssdihed = "alphabeta"

[clustfcc]
min_population = 1

[seletopclusts]
top_models = 4

# ====================================================================
